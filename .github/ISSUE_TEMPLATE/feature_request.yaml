name: Feature request
description: An idea for the compact main window
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or situation, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How the main window could make it easier. Sketches or screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
