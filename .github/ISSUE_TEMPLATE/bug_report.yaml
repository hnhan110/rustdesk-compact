name: Bug report
description: Something is wrong in the compact main window
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This project only changes the main window of RustDesk. Problems with connecting, the remote session, file transfer, the server or mobile apps also happen in official RustDesk; please report those to [RustDesk](https://github.com/rustdesk/rustdesk/issues).
  - type: textarea
    id: desc
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release
      description: The release you installed, as shown on the Releases page.
      placeholder: 1.5.0-compact.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: official
    attributes:
      label: Does the same thing happen in official RustDesk of the same version?
      options:
        - "No, only in this build"
        - "Yes, also in official RustDesk"
        - "I have not checked"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Hide IDs, passwords and names you do not want to share.
  - type: textarea
    id: context
    attributes:
      label: Additional context
